[build]
  command = "node prepare-maintenance.cjs"
  publish = "maintenance/public"
  functions = "maintenance/functions"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/maintenance"
  status = 200
  force = true

# The maintenance deploy contains only the maintenance function.
# Original direct function URLs are absent (404); /.netlify sources
# cannot be used in redirect rules.

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    X-TeamFlow-Maintenance = "migration-v1"

[build]
  command = "node prepare-maintenance.cjs"
  publish = "maintenance/public"
  functions = "maintenance/functions"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/maintenance"
  status = 200
  force = true

[[redirects]]
  from = "/.netlify/functions/team"
  to = "/.netlify/functions/maintenance"
  status = 200
  force = true

[[redirects]]
  from = "/.netlify/functions/works"
  to = "/.netlify/functions/maintenance"
  status = 200
  force = true

[[redirects]]
  from = "/.netlify/functions/auth"
  to = "/.netlify/functions/maintenance"
  status = 200
  force = true

[[redirects]]
  from = "/.netlify/functions/auth/*"
  to = "/.netlify/functions/maintenance"
  status = 200
  force = true

[[redirects]]
  from = "/.netlify/functions/digest"
  to = "/.netlify/functions/maintenance"
  status = 200
  force = true

[[redirects]]
  from = "/.netlify/functions/notifications"
  to = "/.netlify/functions/maintenance"
  status = 200
  force = true

[[redirects]]
  from = "/.netlify/functions/activity"
  to = "/.netlify/functions/maintenance"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    X-TeamFlow-Maintenance = "migration-v1"
